<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

<!-- ============ NAVBAR ============ -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            <i class="fa-solid fa-graduation-cap me-2"></i>
            Student Management System
        </a>

        <button
            class="btn btn-light btn-sm ms-auto"
            id="refreshBtn"
            title="Reload list">
            <i class="fa-solid fa-rotate-right me-1"></i>
            Refresh
        </button>
    </div>
</nav>

<!-- ============ MAIN CONTENT ============ -->
<main class="container py-4">

    <!-- Header row + Delete All + Add buttons -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div>
            <h4 class="mb-0 fw-semibold">
                <i class="fa-solid fa-users text-primary me-2"></i>
                Students
            </h4>
            <small class="text-muted" id="studentCount">Loading...</small>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-outline-danger" id="deleteAllBtn">
                <i class="fa-solid fa-trash-can me-1"></i>
                Delete All
            </button>

            <button class="btn btn-primary" id="addStudentBtn">
                <i class="fa-solid fa-user-plus me-1"></i>
                Add Student
            </button>
        </div>
    </div>

    <!-- Search -->
    <div class="input-group mb-3 shadow-sm">
        <span class="input-group-text bg-white">
            <i class="fa-solid fa-magnifying-glass text-muted"></i>
        </span>
        <input
            type="text"
            id="searchInput"
            class="form-control border-start-0"
            placeholder="Search by name or email...">
    </div>

    <!-- Table card -->
    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col" style="width: 60px;">#</th>
                    <th scope="col">Name</th>
                    <th scope="col">Email</th>
                    <th scope="col">Gender</th>
                    <th scope="col">Date of Birth</th>
                    <th scope="col" class="text-center">Age</th>
                    <th scope="col" class="text-end" style="width: 160px;">Actions</th>
                </tr>
                </thead>
                <tbody id="studentsTableBody">
                <!-- rows injected by JS -->
                </tbody>
            </table>
        </div>

        <!-- Empty state -->
        <div id="emptyState" class="text-center py-5 d-none">
            <i class="fa-regular fa-folder-open fa-3x text-muted mb-3"></i>
            <p class="text-muted mb-0">No students found.</p>
        </div>
    </div>

</main>

<!-- ============ ADD / EDIT MODAL ============ -->
<div class="modal fade" id="studentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">

            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalTitle">
                    <i class="fa-solid fa-user-plus me-2"></i>Add Student
                </h5>
                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>

            <form id="studentForm" novalidate>
                <div class="modal-body">

                    <input type="hidden" id="studentId">

                    <!-- Name -->
                    <div class="mb-3">
                        <label for="nameInput" class="form-label">
                            Full Name <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                            <input
                                type="text"
                                class="form-control"
                                id="nameInput"
                                placeholder="e.g. John Smith"
                                required
                                pattern="^(?=^.{3,15}$)[A-Z][a-z]*(\s[A-Z][a-z]*)*$">
                        </div>
                        <div class="invalid-feedback" id="nameError"></div>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="emailInput" class="form-label">
                            Email <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                            <input
                                type="email"
                                class="form-control"
                                id="emailInput"
                                placeholder="e.g. john1@example.com"
                                required>
                        </div>
                        <div class="invalid-feedback" id="emailError"></div>
                    </div>

                    <!-- Date of Birth -->
                    <div class="mb-3">
                        <label for="dobInput" class="form-label">
                            Date of Birth <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-calendar"></i></span>
                            <input
                                type="date"
                                class="form-control"
                                id="dobInput"
                                required>
                        </div>
                        <div class="invalid-feedback" id="dobError"></div>
                    </div>

                    <!-- Gender -->
                    <div class="mb-3">
                        <label class="form-label">
                            Gender <span class="text-danger">*</span>
                        </label>
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="genderMale"
                                    value="MALE"
                                    required>
                                <label class="form-check-label" for="genderMale">
                                    <i class="fa-solid fa-mars text-primary me-1"></i> Male
                                </label>
                            </div>
                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="genderFemale"
                                    value="FEMALE">
                                <label class="form-check-label" for="genderFemale">
                                    <i class="fa-solid fa-venus text-danger me-1"></i> Female
                                </label>
                            </div>
                        </div>
                        <div class="invalid-feedback d-block" id="genderError"></div>
                    </div>

                    <!-- Error alert -->
                    <div id="formError" class="alert alert-danger d-none py-2 mb-0"></div>

                </div>

                <div class="modal-footer bg-light">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        <i class="fa-solid fa-xmark me-1"></i>Cancel
                    </button>
                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="saveBtn">
                        <i class="fa-solid fa-floppy-disk me-1"></i>Save
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<!-- ============ DELETE ONE CONFIRM MODAL ============ -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow">

            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i>Confirm Delete
                </h5>
                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <p class="mb-0" id="deleteMessage">Are you sure?</p>
            </div>

            <div class="modal-footer bg-light">
                <button
                    type="button"
                    class="btn btn-secondary btn-sm"
                    data-bs-dismiss="modal">Cancel</button>
                <button
                    type="button"
                    class="btn btn-danger btn-sm"
                    id="confirmDeleteBtn">
                    <i class="fa-solid fa-trash me-1"></i>Delete
                </button>
            </div>

        </div>
    </div>
</div>

<!-- ============ DELETE-ALL CONFIRM MODAL ============ -->
<div class="modal fade" id="deleteAllModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow">

            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i>Delete All Students
                </h5>
                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <p class="mb-2">
                    Are you sure you want to delete
                    <strong>all students</strong>?
                </p>
                <p class="text-danger small mb-0">
                    <i class="fa-solid fa-circle-exclamation me-1"></i>
                    This action cannot be undone.
                </p>
            </div>

            <div class="modal-footer bg-light">
                <button
                    type="button"
                    class="btn btn-secondary btn-sm"
                    data-bs-dismiss="modal">Cancel</button>
                <button
                    type="button"
                    class="btn btn-danger btn-sm"
                    id="confirmDeleteAllBtn">
                    <i class="fa-solid fa-trash-can me-1"></i>Delete All
                </button>
            </div>

        </div>
    </div>
</div>

<!-- ============ TOAST CONTAINER ============ -->
<div
    class="toast-container position-fixed top-0 end-0 p-3"
    id="toastContainer"
    style="z-index: 1100;">
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- App JS -->
<script src="js/app.js"></script>

</body>
</html>
